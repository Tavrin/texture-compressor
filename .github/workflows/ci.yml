name: CI
# Enable push and pull request triggers when the repository goes public.
on: workflow_dispatch
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-unknown-linux-gnu
      - run: tools/check_public_text.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features parallel
      - run: cargo test --locked --no-default-features
        env:
          RUSTFLAGS: -Funsafe_code
      - run: cargo clippy --all-targets --features parallel -- -D warnings
      - run: cargo clippy --lib --no-default-features --features simd -- -D warnings
      - run: cargo clippy --all-targets --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings
        env:
          RUSTFLAGS: -C target-feature=+simd128
      - run: cargo build --target wasm32-unknown-unknown
